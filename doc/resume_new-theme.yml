extends: default

page:
  margin: [10mm, 15mm, 10mm, 15mm]
  margin-inner: 15mm
  margin-outer: 15mm
  size: A4

base:
  font-size: 9
  line-height: 1
  line-height-length: 10

prose:
  margin-bottom: 6

table:
  border-color: #000000
  align: left
  font-size: 0.9em

footer:
  columns: =100%
  recto: &_footer
    center:
      content: '{page-number}'
  verso: *_footer

role:
  fhel:
    font-family: Helvetica
  txt-center:
    text-align: center
  fblue:
    font-color: #00589A
  fgray:
    font-color: #A1A1A1
  fst-ital:
    font-style: italic
  head-h1:
    font-size: 2.2em 
  head-h2:
    font-size: 1.2em
  txt-sml:
    font-size: 0.8em
  txt-right:
    text-align: right
